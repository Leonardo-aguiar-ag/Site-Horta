<!-- =========================================================
     HORTA ONG — PAINEL WEB DE IRRIGAÇÃO INTELIGENTE
     Interface Web + MQTT + ESP32 + HiveMQ
========================================================= -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <!-- =======================================================
       CONFIGURAÇÕES BÁSICAS DA PÁGINA
  ======================================================== -->

  <!-- Define codificação UTF-8 -->
  <meta charset="UTF-8" />

  <!-- Responsividade para dispositivos móveis -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título da aba do navegador -->
  <title>Horta ONG — Painel de Irrigação</title>


  <!-- =======================================================
       BIBLIOTECA MQTT.JS
  ======================================================== -->

  <!-- Biblioteca responsável pela comunicação MQTT via WebSocket -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>


  <!-- =======================================================
       CSS — ESTILIZAÇÃO DA INTERFACE
  ======================================================== -->

  <style>

    /* ======================================================
       RESET CSS
       Remove margens/paddings padrões
    ======================================================= */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ======================================================
       VARIÁVEIS GLOBAIS DE CORES
    ======================================================= */

    :root {

      /* Tons verdes */
      --verde: #2d7a3a;
      --verde-cl: #e8f5e9;

      /* Tons azuis */
      --azul: #1565c0;
      --azul-cl: #e3f2fd;

      /* Tons laranja */
      --laranja: #e65100;
      --laranja-cl: #fff3e0;

      /* Vermelho */
      --vermelho: #c62828;

      /* Tons cinza */
      --cinza: #546e7a;
      --cinza-cl: #f5f5f5;

      /* Branco */
      --branco: #ffffff;

      /* Sombra padrão */
      --sombra: 0 2px 8px rgba(0,0,0,0.10);

      /* Borda arredondada */
      --raio: 12px;
    }


    /* ======================================================
       BODY
    ======================================================= */

    body {

      /* Fonte principal */
      font-family: 'Segoe UI', Arial, sans-serif;

      /* Cor de fundo */
      background: #f0f4f8;

      /* Cor padrão dos textos */
      color: #263238;

      /* Altura mínima da tela */
      min-height: 100vh;
    }


    /* ======================================================
       CABEÇALHO
    ======================================================= */

    header {

      background: var(--verde);
      color: #fff;

      padding: 16px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      box-shadow: var(--sombra);
    }

    /* Título principal */
    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* Subtítulo */
    header p {
      font-size: 0.85rem;
      opacity: 0.85;
    }


    /* ======================================================
       STATUS DA CONEXÃO MQTT
    ======================================================= */

    #status-conexao {

      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 0.85rem;

      background: rgba(255,255,255,0.15);

      padding: 6px 12px;

      border-radius: 20px;
    }

    /* Bolinha de status */
    #dot-conexao {

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #f44336;

      transition: background 0.4s;
    }

    /* Estado conectado */
    #dot-conexao.conectado {
      background: #69f0ae;
    }


    /* ======================================================
       LAYOUT PRINCIPAL
    ======================================================= */

    main {

      max-width: 1000px;

      margin: 0 auto;

      padding: 24px 16px;
    }

    /* Grid responsivo */
    .grid {

      display: grid;

      gap: 20px;

      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
    }


    /* ======================================================
       CARDS
    ======================================================= */

    .card {

      background: var(--branco);

      border-radius: var(--raio);

      box-shadow: var(--sombra);

      padding: 20px;
    }

    /* Título dos cards */
    .card h2 {

      font-size: 1rem;

      font-weight: 600;

      color: var(--cinza);

      text-transform: uppercase;

      letter-spacing: 0.05em;

      margin-bottom: 16px;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Ícones */
    .card h2 .icone {
      font-size: 1.2rem;
    }


    /* ======================================================
       VISUALIZAÇÃO DA CAIXA D'ÁGUA
    ======================================================= */

    .nivel-wrap {

      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Estrutura da caixa */
    .caixa-visual {

      width: 60px;
      height: 100px;

      border: 3px solid var(--cinza);

      border-radius: 4px;

      position: relative;

      overflow: hidden;

      flex-shrink: 0;
    }

    /* Água animada */
    .caixa-agua {

      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      background:
        linear-gradient(to top, #1565c0, #42a5f5);

      transition: height 1s ease;

      height: 0%;
    }

    .nivel-info {
      flex: 1;
    }

    /* Número da porcentagem */
    .nivel-pct {

      font-size: 2.8rem;

      font-weight: 700;

      line-height: 1;

      color: var(--azul);
    }

    /* Badge do nível */
    .nivel-badge {

      display: inline-block;

      margin-top: 6px;

      padding: 4px 12px;

      border-radius: 20px;

      font-size: 0.85rem;

      font-weight: 600;
    }

    /* Nível baixo */
    .nivel-badge.baixo {
      background: #ffcdd2;
      color: #b71c1c;
    }

    /* Nível médio */
    .nivel-badge.medio {
      background: #fff9c4;
      color: #f57f17;
    }

    /* Nível cheio */
    .nivel-badge.cheio {
      background: #c8e6c9;
      color: #1b5e20;
    }

    /* Texto da distância */
    .nivel-dist {

      margin-top: 4px;

      font-size: 0.8rem;

      color: var(--cinza);
    }


    /* ======================================================
       CONTROLE DE IRRIGAÇÃO
    ======================================================= */

    .irrigacao-estado {

      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 16px;
    }

    /* LED visual da bomba */
    .led-bomba {

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #ef9a9a;

      border: 2px solid #e53935;

      transition: all 0.3s;
    }

    /* LED ligado */
    .led-bomba.ligado {

      background: #69f0ae;

      border-color: #00c853;

      box-shadow: 0 0 10px rgba(0, 200, 83, 0.5);
    }

    /* Texto do estado */
    .estado-texto {

      font-size: 1.1rem;

      font-weight: 600;
    }

    /* Timer */
    .timer-texto {

      font-size: 0.85rem;

      color: var(--cinza);

      margin-left: auto;
    }


    /* ======================================================
       BOTÕES
    ======================================================= */

    .btn-row {

      display: flex;

      gap: 10px;

      margin-bottom: 14px;
    }

    .btn {

      flex: 1;

      padding: 12px;

      border: none;

      border-radius: 8px;

      font-size: 0.95rem;

      font-weight: 600;

      cursor: pointer;

      transition:
        opacity 0.2s,
        transform 0.1s;
    }

    /* Clique */
    .btn:active {
      transform: scale(0.97);
    }

    /* Botão ligar */
    .btn-ligar {

      background: var(--verde);

      color: #fff;
    }

    /* Botão desligar */
    .btn-desligar {

      background: var(--vermelho);

      color: #fff;
    }

    /* Botão desabilitado */
    .btn:disabled {

      opacity: 0.4;

      cursor: not-allowed;
    }


    /* ======================================================
       ÁREA DE DURAÇÃO
    ======================================================= */

    .duracao-wrap {

      display: flex;

      align-items: center;

      gap: 10px;

      background: var(--cinza-cl);

      padding: 10px 12px;

      border-radius: 8px;

      font-size: 0.9rem;
    }

    /* Select */
    .duracao-wrap select {

      border: 1px solid #ccc;

      border-radius: 6px;

      padding: 4px 8px;

      font-size: 0.9rem;

      flex: 1;
    }


    /* ======================================================
       RESPONSIVIDADE
    ======================================================= */

    @media (max-width: 480px) {

      /* Cabeçalho vertical no celular */
      header {

        flex-direction: column;

        gap: 8px;

        align-items: flex-start;
      }

      /* Botões menores */
      .btn {

        padding: 10px;

        font-size: 0.85rem;
      }
    }

  </style>
</head>

<body>


<!-- =========================================================
     CABEÇALHO
========================================================= -->

<header>

  <!-- Título -->
  <div>

    <h1>🌱 Horta ONG — Irrigação Inteligente</h1>

    <p>Monitoramento e controle via ESP32 + HiveMQ MQTT</p>

  </div>

  <!-- Status da conexão -->
  <div id="status-conexao">

    <div id="dot-conexao"></div>

    <span id="texto-conexao">Desconectado</span>

  </div>

</header>


<!-- =========================================================
     CONTEÚDO PRINCIPAL
========================================================= -->

<main>

  <div class="grid">


    <!-- =====================================================
         CARD — NÍVEL DA ÁGUA
    ====================================================== -->

    <div class="card">

      <h2>
        <span class="icone">💧</span>
        Caixa d'Água
      </h2>

      <div class="nivel-wrap">

        <!-- Caixa visual -->
        <div class="caixa-visual">

          <!-- Água animada -->
          <div class="caixa-agua" id="caixa-agua"></div>

        </div>

        <!-- Informações -->
        <div class="nivel-info">

          <div class="nivel-pct" id="nivel-pct">—</div>

          <div class="nivel-badge" id="nivel-badge">
            aguardando
          </div>

          <div class="nivel-dist" id="nivel-dist"></div>

        </div>

      </div>
    </div>


    <!-- =====================================================
         CARD — CONTROLE DE IRRIGAÇÃO
    ====================================================== -->

    <div class="card">

      <h2>
        <span class="icone">🚿</span>
        Irrigação
      </h2>

      <!-- Estado -->
      <div class="irrigacao-estado">

        <div class="led-bomba" id="led-bomba"></div>

        <span class="estado-texto" id="estado-texto">
          Desligada
        </span>

        <span class="timer-texto" id="timer-texto"></span>

      </div>

      <!-- Botões -->
      <div class="btn-row">

        <!-- Liga irrigação -->
        <button
          class="btn btn-ligar"
          id="btn-ligar"
          onclick="enviarComando('ligar')">

          ▶ Ligar

        </button>

        <!-- Desliga irrigação -->
        <button
          class="btn btn-desligar"
          id="btn-desligar"
          onclick="enviarComando('desligar')">

          ■ Desligar

        </button>

      </div>

    </div>

  </div>
</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

// ============================================================
// CONFIGURAÇÕES MQTT
// ============================================================

// Endereço do broker HiveMQ
const MQTT_HOST =
  "04fb888b825145a2a03b8bb7976f78db.s1.eu.hivemq.cloud:8883";

// Porta MQTT segura via WebSocket
const MQTT_PORT = 8883;

// Usuário MQTT
const MQTT_USER = "ESP32_Projeto";

// Senha MQTT
const MQTT_PASSWORD = "12345Est";

// ID único do navegador
const CLIENT_ID =
  "ESP32_Projeto" +
  Math.random().toString(16).substr(2, 6);


// ============================================================
// TÓPICOS MQTT
// ============================================================

// Tópico de nível da água
const TOPIC_NIVEL = "horta/nivel";

// Tópico de status da irrigação
const TOPIC_STATUS = "horta/irrigacao/status";

// Tópico de comando
const TOPIC_CMD = "horta/irrigacao/cmd";

// Tópico de agendamento
const TOPIC_AGENDAMENTO = "horta/agendamento";


// ============================================================
// VARIÁVEIS GLOBAIS
// ============================================================

// Cliente MQTT
let client = null;

// Controle do timer visual
let timerInterval = null;

// Tempo restante do timer
let timerRestante = 0;


// ============================================================
// FUNÇÃO DE LOG
// ============================================================

// Mostra mensagens no painel
function log(msg, tipo = "") {

  // Caixa de log
  const box =
    document.getElementById("log-box");

  // Data atual
  const d = new Date();

  // Hora formatada
  const ts =
    d.toTimeString().slice(0,8);

  // Cria parágrafo
  const p =
    document.createElement("p");

  // Classe CSS
  p.className =
    tipo ? "log-" + tipo : "";

  // Texto final
  p.textContent =
    `[${ts}] ${msg}`;

  // Adiciona no log
  box.appendChild(p);

  // Scroll automático
  box.scrollTop = box.scrollHeight;
}


// ============================================================
// CONECTAR AO MQTT
// ============================================================

function conectar() {

  log("Conectando ao broker MQTT...", "info");

  // Cria conexão MQTT via WebSocket seguro
  client = mqtt.connect(

    `wss://${MQTT_HOST}:${MQTT_PORT}/mqtt`,

    {

      clientId: CLIENT_ID,

      username: MQTT_USER,

      password: MQTT_PASSWORD,

      clean: true,

      reconnectPeriod: 4000,
    }
  );


  // ==========================================================
  // EVENTO: CONECTADO
  // ==========================================================

  client.on("connect", () => {

    // Atualiza bolinha verde
    document
      .getElementById("dot-conexao")
      .classList.add("conectado");

    // Atualiza texto
    document
      .getElementById("texto-conexao")
      .textContent = "Conectado";

    log("Conectado ao HiveMQ!", "ok");

    // Assina tópicos MQTT
    client.subscribe(TOPIC_NIVEL);
    client.subscribe(TOPIC_STATUS);

    log(
      `Assinando: ${TOPIC_NIVEL}, ${TOPIC_STATUS}`,
      "info"
    );
  });


  // ==========================================================
  // EVENTO: DESCONECTADO
  // ==========================================================

  client.on("disconnect", () => {

    // Remove bolinha verde
    document
      .getElementById("dot-conexao")
      .classList.remove("conectado");

    // Atualiza texto
    document
      .getElementById("texto-conexao")
      .textContent = "Desconectado";

    log("Desconectado do broker", "erro");
  });


  // ==========================================================
  // EVENTO: ERRO MQTT
  // ==========================================================

  client.on("error", (err) => {

    log(
      "Erro MQTT: " + err.message,
      "erro"
    );
  });


  // ==========================================================
  // EVENTO: MENSAGEM RECEBIDA
  // ==========================================================

  client.on("message", (topic, payload) => {

    // Converte payload em string
    const msg = payload.toString();

    // Mostra log
    log(`← ${topic}: ${msg}`);

    try {

      // Converte JSON
      const data = JSON.parse(msg);

      // Atualiza nível
      if (topic === TOPIC_NIVEL)
        atualizarNivel(data);

      // Atualiza status
      if (topic === TOPIC_STATUS)
        atualizarStatus(data);

    } catch (e) {

      log(
        "Erro ao processar mensagem: " + e.message,
        "erro"
      );
    }
  });
}


// ============================================================
// ATUALIZAR NÍVEL DA ÁGUA
// ============================================================

function atualizarNivel(data) {

  // Obtém porcentagem
  const pct = data.porcentagem ?? 0;

  // Obtém status textual
  const st = data.status ?? "baixo";

  // Obtém distância
  const dist = data.distancia_cm ?? "?";


  // Atualiza porcentagem visual
  document
    .getElementById("nivel-pct")
    .textContent = pct + "%";


  // Atualiza altura da água
  document
    .getElementById("caixa-agua")
    .style.height = pct + "%";


  // Atualiza badge
  const badge =
    document.getElementById("nivel-badge");

  badge.textContent = {

    baixo: "⚠ Baixo",

    medio: "Médio",

    cheio: "✔ Cheio"

  }[st] ?? st;

  // Atualiza classe CSS
  badge.className =
    "nivel-badge " + st;


  // Mostra distância
  document
    .getElementById("nivel-dist")
    .textContent =
      `Distância sensor: ${dist} cm`;
}


// ============================================================
// ATUALIZAR STATUS DA IRRIGAÇÃO
// ============================================================

function atualizarStatus(data) {

  // Estado da bomba
  const ligado =
    data.ligado === true;

  // Tempo restante
  const timer =
    data.timer ?? 0;


  // Elementos HTML
  const led =
    document.getElementById("led-bomba");

  const texto =
    document.getElementById("estado-texto");

  const timerEl =
    document.getElementById("timer-texto");


  // Atualiza LED
  led.classList.toggle("ligado", ligado);

  // Atualiza texto
  texto.textContent =
    ligado ? "Ligada ✔" : "Desligada";

  // Atualiza cor
  texto.style.color =
    ligado ? "#2e7d32" : "#c62828";


  // Remove timer anterior
  if (timerInterval)
    clearInterval(timerInterval);

  timerRestante = timer;


  // Se irrigação ligada com timer
  if (ligado && timer > 0) {

    atualizarTimerDisplay();

    // Atualiza contador a cada segundo
    timerInterval = setInterval(() => {

      timerRestante--;

      if (timerRestante <= 0) {

        clearInterval(timerInterval);

        timerEl.textContent = "";

      } else {

        atualizarTimerDisplay();
      }

    }, 1000);

  } else {

    timerEl.textContent = "";
  }
}


// ============================================================
// ATUALIZAR DISPLAY DO TIMER
// ============================================================

function atualizarTimerDisplay() {

  // Minutos
  const m =
    Math.floor(timerRestante / 60);

  // Segundos
  const s =
    timerRestante % 60;

  // Atualiza texto
  document
    .getElementById("timer-texto")
    .textContent =

    `Desliga em ${m}:${String(s).padStart(2, "0")}`;
}


// ============================================================
// ENVIAR COMANDO DE IRRIGAÇÃO
// ============================================================

function enviarComando(acao) {

  // Verifica conexão
  if (!client || !client.connected) {

    log("Não conectado ao broker!", "erro");

    return;
  }

  // Obtém duração selecionada
  const duracao = parseInt(
    document.getElementById("sel-duracao").value
  );

  // Cria JSON
  const payload = JSON.stringify({

    acao,

    duracao_min: duracao
  });

  // Publica comando MQTT
  client.publish(

    TOPIC_CMD,

    payload,

    { qos: 1 },

    (err) => {

      if (err)

        log(
          "Erro ao publicar: " + err.message,
          "erro"
        );

      else

        log(
          `→ Comando enviado: ${acao}`,
          "ok"
        );
    }
  );
}


// ============================================================
// INICIALIZAÇÃO DO SISTEMA
// ============================================================

// Conecta ao MQTT
conectar();

</script>

</body>
</html>
